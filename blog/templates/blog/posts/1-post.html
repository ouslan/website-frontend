<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Post 1: Data Analysis</title>
        <!-- Include any styles or scripts for rendering graphs -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body>
        <h1>Data Analysis: Graph of Sales Performance</h1>
        <p>This post includes a graph of our sales performance over the last year.</p>
        <div>
            <canvas id="salesChart"></canvas>
        </div>
        <script>
      const ctx = document.getElementById("salesChart").getContext("2d");
      const salesChart = new Chart(ctx, {
        type: "line",
        data: {
          labels: ["January", "February", "March", "April", "May"],
          datasets: [
            {
              label: "Sales",
              data: [50, 60, 70, 80, 90],
              borderColor: "rgba(75, 192, 192, 1)",
              fill: false,
            },
          ],
        },
      });
        </script>
    </body>
</html>
